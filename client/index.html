      left: 30px;
      right: 30px;
      height: 3px;
      background-color: #e2e8f0;

    .upload-dropzone:hover {

      background-color: #fffdf5;

      position: relative;
      padding-left: 30px;

    .timeline::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background-color: #e2e8f0;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 24px;
    }
    .timeline-dot {
      position: absolute;
      left: -30px;
      top: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: white;
      border: 3px solid #cbd5e1;
    }
    .timeline-dot.done {
      background-color: #10b981;
      border-color: #10b981;
    }

      font-weight: 900;
      color: rgba(10, 34, 64, 0.04);

      .printable-area {

        left: 0;
        top: 0;
        width: 100%;

    async function apiRequest(endpoint, method = 'GET', body = null) {

        const token = localStorage.getItem('iem_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        
        const res = await fetch(`${API_BASE_URL}${endpoint}`, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null
        });
        if (res.ok) {
          return await res.json();
        }
      } catch (e) {
        // Fallback silently to client-side state if backend server is not running
      }
      return null;

          return;

          return;

          fullName: formData.fullName,
          email: formData.email,
          phone: formData.phone,
          password: formData.password,
          program: formData.program
        });

        const newId = apiRes?.user?.applicationNumber || ('IEM-2026-' + Math.floor(1000 + Math.random() * 9000));
        if (apiRes?.token) {

          ...prev,
          fullName: formData.fullName,
          email: formData.email,

          applicationNumber: newId,
          preferences: [{ order: 1, course: formData.program }]

    // --- PAGE 4: FORGOT PASSWORD ---
    function ForgotPasswordPage({ setCurrentPage }) {
      const [step, setStep] = useState(1);
      const [email, setEmail] = useState('');
      const [otp, setOtp] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [error, setError] = useState('');

      return (
        <div className="py-5" style={{ backgroundColor: '#f1f5f9', minHeight: '80vh' }}>
          <div className="container">
            <div className="row justify-content-center">
              <div className="col-md-7 col-lg-5">
                <div className="iem-card p-4 p-md-5">
                  <div className="text-center mb-4">

                    <h4 className="fw-bold mb-1 text-dark">Password Recovery</h4>
                    <p className="text-muted small">Reset your admission account credentials</p>
                  </div>

                  {error && <div className="alert alert-danger py-2 small">{error}</div>}

                  {step === 1 && (
                    <form onSubmit={e => { e.preventDefault(); if (!email) return; setError(''); setStep(2); }}>
                      <div className="mb-3">
                        <label className="form-label small fw-semibold">Registered Email Address</label>
                        <input type="email" className="form-control" placeholder="arindam.mukherjee@example.com" value={email} onChange={e => setEmail(e.target.value)} required />
                      </div>
                      <button type="submit" className="btn btn-iem-primary w-100 py-2 fw-bold mb-3">Send Reset Code <i className="bi bi-arrow-right ms-1"></i></button>
                    </form>
                  )}

                  {step === 2 && (
                    <form onSubmit={e => { e.preventDefault(); if (otp !== '582914' && otp !== '123456') { setError('Use Demo OTP: 582914'); return; } setError(''); setStep(3); }}>
                      <div className="alert alert-warning py-2 small mb-3">Demo Code sent to {email}: <strong>582914</strong></div>
                      <div className="mb-3">
                        <label className="form-label small fw-semibold">Enter 6-Digit OTP</label>
                        <input type="text" className="form-control text-center fs-4" maxLength="6" placeholder="582914" value={otp} onChange={e => setOtp(e.target.value)} required />
                      </div>
                      <button type="submit" className="btn btn-iem-primary w-100 py-2 fw-bold mb-3">Verify Code</button>
                    </form>
                  )}

                  {step === 3 && (
                    <form onSubmit={e => { e.preventDefault(); if (newPass !== confirmPass) { setError('Passwords do not match'); return; } setError(''); setStep(4); }}>
                      <div className="mb-3">
                        <label className="form-label small fw-semibold">New Password</label>
                        <input type="password" className="form-control" placeholder="Min 6 characters" value={newPass} onChange={e => setNewPass(e.target.value)} required />
                      </div>
                      <div className="mb-3">
                        <label className="form-label small fw-semibold">Confirm Password</label>
                        <input type="password" className="form-control" placeholder="Re-enter" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} required />
                      </div>
                      <button type="submit" className="btn btn-iem-primary w-100 py-2 fw-bold mb-3">Save New Password</button>
                    </form>
                  )}

                  {step === 4 && (
                    <div className="text-center py-3">
                      <i className="bi bi-check-circle-fill text-success fs-1 mb-2 d-block"></i>
                      <h5 className="fw-bold text-success mb-2">Password Successfully Reset!</h5>
                      <button type="button" className="btn btn-iem-primary w-100 py-2 fw-bold" onClick={() => setCurrentPage('login')}>Go to Login</button>
                    </div>
                  )}

                  <div className="text-center small text-muted border-top pt-3 mt-3">
                    <button type="button" className="btn btn-link p-0 text-decoration-none" onClick={() => setCurrentPage('login')}>Back to Login</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

                    <div className="d-flex justify-content-between mb-1">
                      <span className="badge bg-primary fs-6">{applicant.academics?.entranceExam?.examType}</span>
                      <span className="fw-bold text-success fs-5">Rank: #{applicant.academics?.entranceExam?.rank}</span>
                    </div>
                    <div className="small text-muted">Roll: {applicant.academics?.entranceExam?.rollNumber}</div>
                  </div>

                  <div className="p-3 bg-light rounded border mb-3">
                    <div className="fw-bold text-dark small mb-1">Class 12th PCM Aggregate:</div>
                    <div className="fs-4 fw-bold text-success">{applicant.academics?.class12?.pcmPercentage}%</div>
                  </div>

                  <h6 className="fw-bold text-dark small mb-2">Branch Choice:</h6>
                  <div className="p-2 border rounded bg-white small">{applicant.preferences?.[0]?.course}</div>
                </div>
              </div>

              <div className="col-lg-5">
                <div className="iem-card p-4 border-top border-4 border-danger">
                  <h5 className="fw-bold text-dark border-bottom pb-2 mb-3">Officer Decision</h5>
                  <div className="mb-3">
                    <label className="form-label small fw-semibold">Status</label>
                    <select className="form-select" value={status} onChange={e => setStatus(e.target.value)}>
                      <option value="verified">Verified & Approved</option>
                      <option value="seat_allotted">Provisional Seat Allotted</option>
                      <option value="under_review">Under Scrutiny</option>
                      <option value="correction_required">Correction Required</option>
                    </select>
                  </div>

                  <div className="mb-3">
                    <label className="form-label small fw-semibold">Allot Branch</label>
                    <select className="form-select" value={branch} onChange={e => setBranch(e.target.value)}>
                      {INITIAL_PROGRAMS.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                    </select>
                  </div>

                  <div className="mb-3">
                    <label className="form-label small fw-semibold">Remarks</label>
                    <textarea className="form-control" rows="3" value={remarks} onChange={e => setRemarks(e.target.value)}></textarea>
                  </div>

                  <button className="btn btn-iem-primary w-100 py-2 fw-bold" onClick={handleSave}>Save Decision & Endorse</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ROOT ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [authUser, setAuthUser] = useState(null);
      const [applicantData, setApplicantData] = useState(INITIAL_APPLICANT);
      const [applicantsList, setApplicantsList] = useState(SAMPLE_ALL_APPLICANTS);
      const [selectedApplicantId, setSelectedApplicantId] = useState('usr_01');

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentPage]);

      const renderPage = () => {
        switch (currentPage) {
          case 'home': return <HomePage setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} />;
          case 'register': return <RegisterPage setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} setApplicantData={setApplicantData} />;
          case 'login': return <LoginPage setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} />;
          case 'forgot-password': return <ForgotPasswordPage setCurrentPage={setCurrentPage} />;
          case 'applicant-dashboard': return <ApplicantDashboard applicantData={applicantData} setCurrentPage={setCurrentPage} />;
          case 'application-form': return <ApplicationFormPage applicantData={applicantData} setApplicantData={setApplicantData} setCurrentPage={setCurrentPage} />;
          case 'document-upload': return <DocumentUploadPage applicantData={applicantData} setApplicantData={setApplicantData} setCurrentPage={setCurrentPage} />;
          case 'payment': return <PaymentPage applicantData={applicantData} setApplicantData={setApplicantData} setCurrentPage={setCurrentPage} />;
          case 'application-status': return <ApplicationStatusPage applicantData={applicantData} setApplicantData={setApplicantData} setCurrentPage={setCurrentPage} />;
          case 'admin-login': return <AdminLoginPage setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} />;
          case 'admin-dashboard': return <AdminDashboardPage applicantsList={applicantsList} setSelectedApplicantId={setSelectedApplicantId} setCurrentPage={setCurrentPage} />;
          case 'application-verification': return <ApplicationVerificationPage selectedApplicantId={selectedApplicantId} applicantsList={applicantsList} setApplicantsList={setApplicantsList} setCurrentPage={setCurrentPage} />;
          default: return <HomePage setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} />;
        }
      };

      return (
        <div className="d-flex flex-column min-vh-100">
          <Navbar 
            currentPage={currentPage} 
            setCurrentPage={setCurrentPage} 
            authUser={authUser} 
            setAuthUser={setAuthUser}
            setSelectedApplicantId={setSelectedApplicantId}
          />
          <main className="flex-grow-1">{renderPage()}</main>
          <Footer setCurrentPage={setCurrentPage} setAuthUser={setAuthUser} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
